name: Native package-plan resolution

on:
  pull_request:
    branches: [main]
    paths:
      - 'installer/**'
      - 'install.sh'
      - 'check-deps.sh'
      - 'MULTI-DISTRO.md'
      - '.github/workflows/package-resolution.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-plan:
    name: ${{ matrix.distro }} package resolution (container)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: Arch Linux
            image: archlinux:base
            id: arch
          - distro: Fedora 44
            image: fedora:44
            id: fedora
          - distro: Debian 13
            image: debian:trixie
            id: debian
          - distro: Ubuntu 26.10
            image: ubuntu:26.10
            id: ubuntu
          - distro: Kali Linux rolling
            image: kalilinux/kali-rolling
            id: kali

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Resolve packages using the native package manager
        env:
          DISTRO_ID: ${{ matrix.id }}
          CONTAINER_IMAGE: ${{ matrix.image }}
        run: |
          set -Eeuo pipefail
          docker pull "$CONTAINER_IMAGE"
          docker run --rm \
            --env DISTRO_ID="$DISTRO_ID" \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            "$CONTAINER_IMAGE" bash -lc '
              set -Eeuo pipefail

              case "$DISTRO_ID" in
                arch)
                  pacman-key --init
                  pacman-key --populate archlinux
                  pacman -Syyu --noconfirm
                  ;;
                fedora)
                  # Fedora 44 intentionally requires a compatible user-provided Hyprland.
                  # Stub only its version probe so this job can resolve every other package.
                  cat > /usr/local/bin/Hyprland <<'HYPRLAND'
#!/usr/bin/env bash
printf "Hyprland 0.56.2\\n"
HYPRLAND
                  cat > /usr/local/bin/hyprctl <<'HYPRCTL'
#!/usr/bin/env bash
case "$*" in
  *-j*version*) printf '{"tag":"v0.56.2"}\\n' ;;
  *version*) printf "Hyprland 0.56.2\\n" ;;
  *) exit 1 ;;
esac
HYPRCTL
                  chmod +x /usr/local/bin/Hyprland /usr/local/bin/hyprctl
                  dnf5 makecache --refresh
                  ;;
                debian)
                  printf "%s\\n" "deb http://deb.debian.org/debian trixie-backports main" \
                    > /etc/apt/sources.list.d/sekaipop-backports.list
                  apt-get update
                  ;;
                ubuntu)
                  shopt -s nullglob
                  ubuntu_sources=(/etc/apt/sources.list.d/*.sources)
                  if (("${#ubuntu_sources[@]}")); then
                    for source_file in "${ubuntu_sources[@]}"; do
                      sed -i -E "s/^Components:.*/Components: main universe restricted multiverse/" "$source_file"
                    done
                  else
                    . /etc/os-release
                    printf "deb http://archive.ubuntu.com/ubuntu %s main universe restricted multiverse\\n" "$VERSION_CODENAME" \
                      > /etc/apt/sources.list.d/sekaipop-universe.list
                    printf "deb http://security.ubuntu.com/ubuntu %s-security main universe restricted multiverse\\n" "$VERSION_CODENAME" \
                      >> /etc/apt/sources.list.d/sekaipop-universe.list
                  fi
                  apt-get update
                  ;;
                kali)
                  apt-get update
                  ;;
                *)
                  printf "Unsupported CI matrix id: %s\\n" "$DISTRO_ID" >&2
                  exit 2
                  ;;
              esac

              ./install.sh --plan --profile standard --no-update --no-log
            '
